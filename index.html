<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOPIVERSITY - Student E-Commerce Platform</title>
    <meta name="description" content="A modern, clean, and mobile-first student multi-vendor e-commerce platform. The marketplace at your fingertips." />
    <meta property="og:title" content="SHOPIVERSITY - Student E-Commerce Platform" />
    <meta property="og:description" content="A modern, clean, and mobile-first student multi-vendor e-commerce platform. The marketplace at your fingertips." />
    <!-- Official Shopiversity Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ff6b00" />
    <meta property="og:image" content="/favicon-512x512.png" />
    <meta name="twitter:image" content="/favicon-512x512.png" />
    <style>
      /* Pre-React Instant Brand Loader */
      #initial-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        z-index: 99999;
        user-select: none;
        padding: 16px;
      }
      @media (prefers-color-scheme: dark) {
        #initial-preloader {
          background-color: #060b13;
          color: #ffffff;
        }
      }
      @keyframes floatEmblem {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.03); }
      }
      @keyframes orbitSpinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitSpinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes sweepProgress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(210%); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.32; transform: scale(0.94); }
        50% { opacity: 0.65; transform: scale(1.1); }
      }
      .preloader-stage {
        position: relative;
        width: 116px;
        height: 116px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }
      .preloader-glow {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 107, 0, 0.25) 0%, transparent 72%);
        filter: blur(14px);
        animation: pulseGlow 2.4s ease-in-out infinite;
      }
      .preloader-orbit-outer {
        position: absolute;
        inset: 0;
        animation: orbitSpinCW 2.8s linear infinite;
      }
      .preloader-orbit-inner {
        position: absolute;
        inset: 8px;
        animation: orbitSpinCCW 4.2s linear infinite;
      }
      .preloader-cart-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        animation: floatEmblem 2.4s ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        .preloader-cart-wrap {
          background-color: rgba(255, 255, 255, 0.95);
          padding: 8px;
        }
      }
      .preloader-title {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
        display: flex;
        align-items: baseline;
      }
      .preloader-title-dark {
        color: #141414;
      }
      .preloader-title-orange {
        color: #ff7a00;
      }
      .preloader-tagline {
        margin-top: 6px;
        font-size: 11px;
        font-style: italic;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #334155;
      }
      @media (prefers-color-scheme: dark) {
        .preloader-title-dark {
          color: #ffffff;
        }
        .preloader-tagline {
          color: #cbd5e1;
        }
      }
      .preloader-bar-wrap {
        margin-top: 22px;
        width: 196px;
        height: 5px;
        border-radius: 9999px;
        background-color: rgba(148, 163, 184, 0.2);
        overflow: hidden;
        position: relative;
      }
      .preloader-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, #ff7b00, transparent);
        box-shadow: 0 0 12px rgba(255, 107, 0, 0.8);
        animation: sweepProgress 1.35s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-glow, .preloader-orbit-outer, .preloader-orbit-inner, .preloader-cart-wrap, .preloader-bar-fill {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader">
        <div class="preloader-stage">
          <div class="preloader-glow"></div>
          <svg class="preloader-orbit-outer" viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="preOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff9500" stop-opacity="0.95" />
                <stop offset="60%" stop-color="#ff6b00" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="54" fill="none" stroke="url(#preOrbitGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 220" />
          </svg>
          <svg class="preloader-orbit-inner" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="48" fill="none" stroke="#ff6b00" stroke-opacity="0.24" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="48 110 24 120" />
          </svg>
          <div class="preloader-cart-wrap">
            <img
              src="/shopiversity-logo.png"
              alt="Shopiversity"
              width="70"
              height="70"
              style="object-fit: contain; filter: drop-shadow(0 10px 22px rgba(255, 107, 0, 0.34));"
            />
          </div>
        </div>
        <div class="preloader-title">
          <span class="preloader-title-dark">Shop</span><span style="position:relative;display:inline-block;"><span class="preloader-title-dark">ı</span><span style="position:absolute;left:50%;transform:translateX(-50%);top:0.06em;width:0.23em;height:0.23em;border-radius:9999px;background:#ff7a00;"></span></span><span class="preloader-title-orange">versity</span>
        </div>
        <div class="preloader-tagline">the marketplace at your finger tips</div>
        <div class="preloader-bar-wrap">
          <div class="preloader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
